name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_pr:
        description: Merged release PR number to recover
        required: true
        type: string

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    name: Resolve merged release PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release_pr_merge: ${{ steps.detect.outputs.release_pr_merge }}
      release_pr_number: ${{ steps.detect.outputs.release_pr_number }}
      release_source_sha: ${{ steps.detect.outputs.release_source_sha }}
      target_sha: ${{ steps.detect.outputs.target_sha }}
    steps:
      - name: Resolve the source pull request
        id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_PR_INPUT: ${{ inputs.release_pr }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "Release recovery must run from main" >&2
              exit 1
            fi
            if [[ ! "$RELEASE_PR_INPUT" =~ ^[1-9][0-9]*$ ]]; then
              echo "release_pr must be a positive pull request number" >&2
              exit 1
            fi
            release_pr="$(
              gh api "repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PR_INPUT}"
            )"
          else
            pull_requests="$(
              gh api "repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}/pulls"
            )"
            matching_prs="$(
              jq -c \
                --arg sha "$COMMIT_SHA" \
                '[.[] | select(
                  .merged_at != null and
                  .base.ref == "main" and
                  (.head.ref | startswith("release-plz-")) and
                  .merge_commit_sha == $sha
                )]' \
                <<<"$pull_requests"
            )"
            matching_count="$(jq -r 'length' <<<"$matching_prs")"
            if [[ "$matching_count" == "0" ]]; then
              echo "release_pr_merge=false" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$matching_count" != "1" ]]; then
              echo "commit ${COMMIT_SHA} has multiple matching release PRs" >&2
              exit 1
            fi
            release_pr="$(jq -c '.[0]' <<<"$matching_prs")"
          fi

          release_pr_number="$(jq -er '.number' <<<"$release_pr")"
          merged_at="$(jq -r '.merged_at // empty' <<<"$release_pr")"
          base_ref="$(jq -er '.base.ref' <<<"$release_pr")"
          head_ref="$(jq -er '.head.ref' <<<"$release_pr")"
          release_source_sha="$(jq -er '.head.sha' <<<"$release_pr")"
          target_sha="$(jq -r '.merge_commit_sha // empty' <<<"$release_pr")"

          if [[ -z "$merged_at" || "$base_ref" != "main" || "$head_ref" != release-plz-* ]]; then
            echo "PR #${release_pr_number} is not a merged release-plz PR into main" >&2
            exit 1
          fi
          if [[ ! "$release_source_sha" =~ ^[0-9a-f]{40}$ || ! "$target_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "PR #${release_pr_number} has invalid source or merge commit metadata" >&2
            exit 1
          fi

          {
            echo "release_pr_merge=true"
            echo "release_pr_number=${release_pr_number}"
            echo "release_source_sha=${release_source_sha}"
            echo "target_sha=${target_sha}"
          } >>"$GITHUB_OUTPUT"

  validate:
    name: Validate release candidate
    needs: detect
    if: needs.detect.outputs.release_pr_merge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.detect.outputs.target_sha }}

      - name: Verify the reviewed release commit
        shell: bash
        env:
          RELEASE_PR_NUMBER: ${{ needs.detect.outputs.release_pr_number }}
          RELEASE_SOURCE_SHA: ${{ needs.detect.outputs.release_source_sha }}
          TARGET_SHA: ${{ needs.detect.outputs.target_sha }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [[ "$(git rev-parse HEAD)" != "$TARGET_SHA" ]]; then
            echo "checked-out commit does not match release PR #${RELEASE_PR_NUMBER}" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TARGET_SHA" origin/main; then
            echo "release PR #${RELEASE_PR_NUMBER} is no longer on main" >&2
            exit 1
          fi
          read -r -a merge_commit <<<"$(git rev-list --parents -n 1 "$TARGET_SHA")"
          if [[ "${#merge_commit[@]}" -lt 3 ]]; then
            echo "release PR #${RELEASE_PR_NUMBER} was not merged with a merge commit" >&2
            exit 1
          fi
          if [[ " ${merge_commit[*]:1} " != *" ${RELEASE_SOURCE_SHA} "* ]]; then
            echo "release PR head ${RELEASE_SOURCE_SHA} is not a parent of ${TARGET_SHA}" >&2
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-targets

      - name: Build documentation
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Test the minimum supported Rust version
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 test --all-targets

      - name: Validate the package
        run: cargo publish --dry-run

  release:
    name: Publish merged release PR
    needs: [detect, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
      pull-requests: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.detect.outputs.target_sha }}

      - name: Restore the main branch identity
        shell: bash
        env:
          TARGET_SHA: ${{ needs.detect.outputs.target_sha }}
        run: |
          git checkout -B main "$TARGET_SHA"
          git branch --set-upstream-to=origin/main main

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Publish crate, tag, and GitHub release
        id: release_plz
        continue-on-error: true
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
          version: 0.3.160
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Reconcile published crate with GitHub
        id: reconcile
        if: always()
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ needs.detect.outputs.release_source_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/reconcile-release.sh

      - name: Require a complete release
        if: always() && steps.reconcile.outputs.complete != 'true'
        shell: bash
        run: |
          echo "the release is incomplete or conflicts with durable release state" >&2
          exit 1
