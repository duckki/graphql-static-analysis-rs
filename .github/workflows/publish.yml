name: Publish

on:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish crate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Verify the release tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          crate_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "graphql-static-analysis") | .version')"
          if [[ "$GITHUB_REF_NAME" != "v$crate_version" ]]; then
            echo "release tag $GITHUB_REF_NAME does not match crate version $crate_version" >&2
            exit 1
          fi

      - name: Verify the commit is on main
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "commit $GITHUB_SHA is not on main" >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-targets

      - name: Build documentation
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Test the minimum supported Rust version
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 test --all-targets

      - name: Validate the package
        run: cargo publish --dry-run

      - name: Authenticate with crates.io
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        if: github.event_name == 'release'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
