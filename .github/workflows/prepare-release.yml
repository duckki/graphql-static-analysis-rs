name: Prepare release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-pr:
    name: Create release PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-prepare
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the current main branch
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [[ "$GITHUB_SHA" != "$(git rev-parse origin/main)" ]]; then
            echo "Prepare release must run from the current tip of main" >&2
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Create the release PR
        id: release_pr
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
          version: 0.3.160
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CI on the release PR
        if: steps.release_pr.outputs.prs_created == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR: ${{ steps.release_pr.outputs.pr }}
        run: |
          head_branch="$(jq -r '.head_branch // empty' <<<"$RELEASE_PR")"
          if [[ -z "$head_branch" ]]; then
            echo "release-plz returned no release PR branch" >&2
            exit 1
          fi
          gh workflow run ci.yml --ref "$head_branch"

      - name: Summarize the release request
        if: steps.release_pr.outputs.prs_created == 'true'
        shell: bash
        env:
          RELEASE_PR: ${{ steps.release_pr.outputs.pr }}
        run: |
          release_pr_url="$(jq -r '.html_url' <<<"$RELEASE_PR")"
          echo "Release PR: ${release_pr_url}" >>"$GITHUB_STEP_SUMMARY"

      - name: Report no releasable changes
        if: steps.release_pr.outputs.prs_created != 'true'
        shell: bash
        run: echo "No unreleased package changes were found." >>"$GITHUB_STEP_SUMMARY"
