[package]
name = "graphql-static-analysis"
version = "0.1.0"
description = "Composable static analyses for GraphQL queries."
readme = "README.md"
license = "MIT"
keywords = ["graphql", "static-analysis", "query-analysis"]
categories = ["development-tools", "web-programming"]
edition = "2021"
rust-version = "1.85"

[dependencies]
apollo-compiler = "1.32.0"
fixedbitset = "0.5.7"
thiserror = "2.0.0"

[dev-dependencies]
pretty_assertions = "1.3.0"

[lints.rust]
unsafe_code = "forbid"
