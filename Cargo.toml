[package]
name = "graphql-static-analysis"
version = "0.2.1"
description = "A composable static-analysis engine for GraphQL operations"
readme = "README.md"
documentation = "https://docs.rs/graphql-static-analysis"
repository = "https://github.com/duckki/graphql-static-analysis-rs"
license = "MIT"
keywords = ["graphql", "static-analysis", "query-analysis"]
categories = ["development-tools", "web-programming"]
exclude = [
    "/.github/",
    "/.gitignore",
    "/AGENTS.md",
    "/Makefile",
    "/benchmarks/",
    "/docs/performance-benchmark.md",
    "/docs/release-engineering.md",
    "/fuzz/",
    "/release-plz.toml",
    "/rustfmt.toml",
]
edition = "2021"
rust-version = "1.90"

[dependencies]
apollo-compiler = "1.32.0"
fixedbitset = "0.5.7"
thiserror = "2.0.0"

[dev-dependencies]
pretty_assertions = "1.3.0"

[lints.rust]
unsafe_code = "forbid"
